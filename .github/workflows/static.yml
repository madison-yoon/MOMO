# Build the React application and publish only its production artifact.
name: Deploy MOMO frontend to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: momo-frontend/yarn.lock

      - name: Validate production API URL
        shell: bash
        env:
          REACT_APP_API_BASE_URL: ${{ vars.MOMO_API_BASE_URL }}
        run: |
          if [[ -z "$REACT_APP_API_BASE_URL" ]]; then
            echo "::error::Set the repository variable MOMO_API_BASE_URL to the public HTTPS backend URL."
            exit 1
          fi
          if [[ ! "$REACT_APP_API_BASE_URL" =~ ^https:// ]]; then
            echo "::error::MOMO_API_BASE_URL must start with https://. localhost is not a production API."
            exit 1
          fi

      - name: Install dependencies and build React
        working-directory: momo-frontend
        env:
          PUBLIC_URL: /MOMO
          REACT_APP_API_BASE_URL: ${{ vars.MOMO_API_BASE_URL }}
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile
          yarn build
          cp build/index.html build/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload React build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: momo-frontend/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
