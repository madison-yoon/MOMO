name: Backend Tests

on:
  push:
    branches:
      - feature/api-cache-hardening
    paths:
      - "momo-backend/**"
      - ".github/workflows/backend-test.yml"
  pull_request:
    paths:
      - "momo-backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run backend tests
        working-directory: momo-backend
        run: ./gradlew test
