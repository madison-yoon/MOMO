spring.application.name=momo-backend
server.port=8111

spring.datasource.url=jdbc:mysql://localhost:3306/momo_db?serverTimezone=Asia/Seoul
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0


# KOBIS API 설정
kobis.api.key=${KOBIS_API_KEY:}
kobis.api.base-url=https://www.kobis.or.kr/kobisopenapi/webservice/rest


# KMDb API 설정
kmdb.api.key=${KMDB_API_KEY:}
kmdb.api.base-url=http://api.koreafilm.or.kr/openapi-data2/wisenut

# TMDB API
tmdb.api.key=${TMDB_API_KEY:}
tmdb.api.base-url=https://api.themoviedb.org/3
