
spring.application.name=momo-backend
server.port=8111

# DB URL·사용자명은 로컬 기본값을 제공하고 비밀번호는 실행 환경에서 주입한다.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/momo_db?serverTimezone=Asia/Seoul}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# 쉼표로 여러 프론트엔드 Origin을 지정할 수 있다.
momo.cors.allowed-origins=${MOMO_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://192.168.0.166:3000}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

# KOBIS API 설정
kobis.api.key=ac316c308a606656b80fdc5e6f490081
kobis.api.base-url=https://www.kobis.or.kr/kobisopenapi/webservice/rest

# KMDb API 설정
kmdb.api.key=27FR7HIBU2H21H5NATSU
kmdb.api.base-url=http://api.koreafilm.or.kr/openapi-data2/wisenut

# TMDB API 설정
tmdb.api.key=81ab90921f366f46d3cd6ee7ec37331e
tmdb.api.base-url=https://api.themoviedb.org/3

# OAuth 공급자 설정: 환경변수와 Spring 프로퍼티 이름을 명시적으로 연결한다.
kakao.client-id=${KAKAO_CLIENT_ID:}
kakao.client-secret=${KAKAO_CLIENT_SECRET:}
kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:3000/oauth/kakao}
kakao.admin-key=${KAKAO_ADMIN_KEY:}
naver.oauth.client-id=${NAVER_CLIENT_ID:}
naver.oauth.client-secret=${NAVER_CLIENT_SECRET:}
naver.oauth.redirect-uri=${NAVER_REDIRECT_URI:http://localhost:3000/oauth/naver}
google.oauth.client-id=${GOOGLE_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET:}
google.oauth.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:3000/oauth/google}

# 외부 영화 API 연결 및 응답 제한 시간
external-api.connect-timeout=3s
external-api.read-timeout=8s

# API 일일 호출 한도: 실제 계정에 부여된 값이 확인된 경우에만 지정한다.
# 0(기본값)은 임의의 일일 제한을 두지 않고 호출량만 기록한다.
# KOBIS/KMDb는 발급 키별 이용 한도를 확인한 뒤 환경변수로 설정한다.
# TMDb는 고정 일일 쿼터가 아닌 초당 요청 제한을 공개하고 있으므로 일일 한도는 0으로 둔다.
momo.api-budget.kobis.daily-limit=${MOMO_KOBIS_DAILY_BUDGET:0}
momo.api-budget.kmdb.daily-limit=${MOMO_KMDB_DAILY_BUDGET:0}
momo.api-budget.tmdb.daily-limit=${MOMO_TMDB_DAILY_BUDGET:0}

# 외부 API를 유발하는 공개 요청의 IP별 빈도 제한
momo.external-api-rate-limit.per-minute=${MOMO_EXTERNAL_API_RATE_LIMIT_PER_MINUTE:60}
momo.external-api-rate-limit.poster-ensure-per-minute=${MOMO_POSTER_ENSURE_RATE_LIMIT_PER_MINUTE:5}

# 전체 영화 카탈로그 자동 수집: 최초 전체 수집 후 매일 최근 2개 연도 재확인
momo.catalog.sync.enabled=true
momo.catalog.sync.delay-ms=5000
momo.catalog.enrichment.delay-ms=60000
momo.poster.retry.enabled=true
momo.poster.retry.delay-ms=30000
momo.poster.migration.delay-ms=60000

# 영화 포스터 원본 파일 저장 위치 (프로젝트 외부)
momo.storage.poster-dir=${user.home}/momo-data/posters

# JWT 설정
jwt.secret=${JWT_SECRET:}
jwt.access-exp-ms=${JWT_ACCESS_EXP_MS:1800000}
jwt.refresh-exp-ms=${JWT_REFRESH_EXP_MS:604800000}

# MOMO RAG transactional outbox. The rag6 SQL must be applied before setting RAG_ENABLED=true.
momo.rag.outbox.poll-delay-ms=${RAG_OUTBOX_POLL_DELAY_MS:1000}
momo.rag.outbox.lease-ms=${RAG_OUTBOX_LEASE_MS:30000}
momo.rag.outbox.retry-base-ms=${RAG_OUTBOX_RETRY_BASE_MS:1000}
momo.rag.outbox.retry-max-ms=${RAG_OUTBOX_RETRY_MAX_MS:300000}
momo.rag.outbox.cleanup-cron=${RAG_OUTBOX_CLEANUP_CRON:0 0 4 * * *}
momo.rag.outbox.retention-days=${RAG_OUTBOX_RETENTION_DAYS:30}
