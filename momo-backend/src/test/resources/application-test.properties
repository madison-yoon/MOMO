# 외부 API를 호출하는 예약 작업은 테스트에서 실행하지 않는다.
momo.catalog.sync.enabled=false
momo.catalog.enrichment.enabled=false
momo.poster.retry.enabled=false
momo.poster.migration.enabled=false
momo.boxoffice.scheduler.enabled=false

# CI에는 개인 .env가 없다. 외부 API를 모의 처리하는 테스트만 실행할 수 있도록 실제 키 대신 표본 값을 사용한다.
# 실제 실행의 application.properties 및 팀원이 공유하는 .env는 변경하지 않는다.
KOBIS_API=mock-kobis-api-key
KMDB_API=mock-kmdb-api-key
TMDB_API=mock-tmdb-api-key
